apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-website
  namespace: website
  labels:
    app: k8s-website
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: k8s-website
  template:
    metadata:
      labels:
        app: k8s-website
    spec:
      containers:
      - name: k8s-website
        image: kingricky111/k8s-frontend:v6.2
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: k8s-chatbot-api-secret
              key: OPENAI_API_KEY
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "250m"

