apiVersion: argoproject.io/v1alpha1
kind: Application
metadata:
  name: k8s-website
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kingricky111/K8s-Website.git
    targetRevision: HEAD
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy: 
    automated:
      prune: true
      selfHeal: true
      