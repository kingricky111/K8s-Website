apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-chatbot-api
  namespace: website
  labels:
    app: k8s-chatbot-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-chatbot-api
  template:
    metadata:
      labels:
        app: k8s-chatbot-api
    spec:
      containers:
      - name: k8s-chatbot-api
        image: kingricky111/website-chatbot-api:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:  
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "250m"